<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 粒子系统 (增强版)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 摄像头预览 - 增加边框提示状态 */
        #video-input { 
            position: absolute; bottom: 10px; right: 10px; width: 160px; height: 120px; 
            z-index: 2; border-radius: 8px; opacity: 0; transform: scaleX(-1); 
            border: 2px solid #333; transition: opacity 0.5s;
        }
        #video-input.active { opacity: 0.7; border-color: #00ff00; }

        /* Loading 遮罩 */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white;
            transition: opacity 0.5s; pointer-events: none;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333;
            border-top: 4px solid #ff69b4; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #status-bar {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            color: rgba(255,255,255,0.5); font-size: 12px; pointer-events: none;
        }

        /* 全屏按钮 */
        #fs-btn {
            position: absolute; bottom: 20px; left: 20px; z-index: 10;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; padding: 10px 20px; border-radius: 20px;
            cursor: pointer; backdrop-filter: blur(5px); transition: 0.3s;
        }
        #fs-btn:hover { background: rgba(255, 105, 180, 0.4); border-color: #ff69b4; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loading-text">正在加载 AI 模型...<br><span style="font-size:12px; opacity:0.7">(如果长时间卡住，将自动切换为鼠标模式)</span></div>
    </div>

    <div id="status-bar">等待摄像头...</div>

    <!-- 必须添加 autoplay 和 muted 否则 Chrome 可能阻止播放 -->
    <video id="video-input" playsinline autoplay muted></video>
    
    <div id="canvas-container"></div>
    <button id="fs-btn">全屏模式</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/hands": "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js",
                "@mediapipe/camera_utils": "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';
        import { Hands } from 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js';
        import { Camera } from 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js';

        // --- 状态变量 ---
        const state = {
            handScale: 1.0,
            isCameraActive: false,
            shape: 'heart',
            color: '#ff69b4',
            particleSize: 0.4
        };

        let scene, camera, renderer, particles, geometry, material, controls;
        const particleCount = 12000; 
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const targetPositions = new Float32Array(particleCount * 3);
        let baseColor = new THREE.Color(state.color);

        // --- 1. Three.js 初始化 ---
        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 性能优化
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;

            const sprite = getSprite();
            material = new THREE.PointsMaterial({
                size: state.particleSize,
                map: sprite,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.8
            });

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            generateShape('heart');

            window.addEventListener('resize', onWindowResize);
            document.getElementById('fs-btn').addEventListener('click', () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                else document.exitFullscreen();
            });

            // 鼠标交互回退
            window.addEventListener('mousemove', (e) => {
                if (!state.isCameraActive) {
                    // 如果摄像头没激活，用鼠标 X 轴位置模拟手势
                    const normalizedX = e.clientX / window.innerWidth;
                    state.handScale = 0.5 + normalizedX * 1.5; // 0.5 ~ 2.0
                    document.getElementById('status-bar').innerText = "鼠标模式：左右移动鼠标控制缩放";
                }
            });
        }

        // --- 2. 形状生成 (保持不变) ---
        function generateShape(type) {
            state.shape = type;
            const color1 = new THREE.Color(baseColor);
            const color2 = new THREE.Color(0xffffff);

            for (let i = 0; i < particleCount; i++) {
                let x, y, z;
                
                // 颜色
                const mixRatio = Math.random();
                const finalColor = mixRatio > 0.7 ? color2 : color1;

                if (type === 'heart') {
                    const t = Math.random() * Math.PI * 2;
                    const scale = Math.pow(Math.random(), 0.3);
                    x = 16 * Math.pow(Math.sin(t), 3);
                    y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                    z = (Math.random() - 0.5) * 10 * scale;
                    x *= scale; y *= scale;
                    colors[i*3] = finalColor.r; colors[i*3+1] = finalColor.g; colors[i*3+2] = finalColor.b;
                } else if (type === 'flower') {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI;
                    const rBase = 10 + 5 * Math.cos(5 * u);
                    const rScale = Math.random();
                    x = rBase * Math.sin(v) * Math.cos(u) * rScale;
                    y = rBase * Math.sin(v) * Math.sin(u) * rScale;
                    z = (Math.random() - 0.5) * 5;
                    colors[i*3] = finalColor.r; colors[i*3+1] = finalColor.g * 0.8; colors[i*3+2] = finalColor.b;
                } else if (type === 'saturn') {
                    if (Math.random() > 0.4) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 12 + Math.random() * 8;
                        x = Math.cos(angle) * dist; z = Math.sin(angle) * dist; y = (Math.random() - 0.5) * 0.5;
                        colors[i*3] = 0.8; colors[i*3+1] = 0.7; colors[i*3+2] = 0.5;
                    } else {
                        const rS = 8 * Math.cbrt(Math.random());
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        x = rS * Math.sin(phi) * Math.cos(theta);
                        y = rS * Math.sin(phi) * Math.sin(theta);
                        z = rS * Math.cos(phi);
                        colors[i*3] = finalColor.r; colors[i*3+1] = finalColor.g; colors[i*3+2] = finalColor.b;
                    }
                } else if (type === 'firework') {
                    const rF = 20 * Math.cbrt(Math.random());
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    x = rF * Math.sin(phi) * Math.cos(theta);
                    y = rF * Math.sin(phi) * Math.sin(theta);
                    z = rF * Math.cos(phi);
                    colors[i*3] = Math.random(); colors[i*3+1] = Math.random(); colors[i*3+2] = Math.random();
                }

                targetPositions[i * 3] = x;
                targetPositions[i * 3 + 1] = y;
                targetPositions[i * 3 + 2] = z;
            }
            geometry.attributes.color.needsUpdate = true;
        }

        function getSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad; ctx.fillRect(0,0,32,32);
            return new THREE.CanvasTexture(canvas);
        }

        // --- 3. MediaPipe 初始化 (带超时处理) ---
        async function initMediaPipe() {
            const videoElement = document.getElementById('video-input');
            const loader = document.getElementById('loader');
            const loadingText = document.getElementById('loading-text');

            // 设置超时，防止无限等待
            const timeoutId = setTimeout(() => {
                if (!state.isCameraActive) {
                    console.warn("Camera init timed out.");
                    loader.style.opacity = 0;
                    setTimeout(() => loader.remove(), 500);
                    document.getElementById('status-bar').innerText = "摄像头加载超时，已切换至鼠标交互模式";
                }
            }, 8000); // 8秒超时

            try {
                const hands = new Hands({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }});

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults((results) => {
                    if (!state.isCameraActive) {
                        // 第一次成功识别
                        state.isCameraActive = true;
                        clearTimeout(timeoutId);
                        loader.style.opacity = 0;
                        setTimeout(() => loader.remove(), 500);
                        videoElement.classList.add('active');
                        document.getElementById('status-bar').innerText = "手势识别中：张开手掌放大，捏合缩小";
                    }

                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        const landmarks = results.multiHandLandmarks[0];
                        const thumb = landmarks[4];
                        const index = landmarks[8];
                        const dist = Math.sqrt(Math.pow(thumb.x - index.x, 2) + Math.pow(thumb.y - index.y, 2));
                        
                        // 映射距离
                        let normalized = (dist - 0.05) / (0.25 - 0.05);
                        normalized = Math.max(0, Math.min(1, normalized));
                        const targetScale = 0.5 + normalized * 1.5;
                        state.handScale += (targetScale - state.handScale) * 0.1;
                    }
                });

                const cam = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({image: videoElement});
                    },
                    width: 320,
                    height: 240
                });

                await cam.start();
            } catch (error) {
                console.error("MediaPipe Error:", error);
                loadingText.innerHTML = "摄像头或模型加载失败<br>请检查网络或使用本地服务器(Localhost)";
                // 即使失败，也移除遮罩让用户看3D
                setTimeout(() => {
                    loader.style.opacity = 0;
                    setTimeout(() => loader.remove(), 500);
                }, 2000);
            }
        }

        // --- 4. UI ---
        function initGUI() {
            const gui = new GUI({ title: '控制面板' });
            gui.add(state, 'shape', ['heart', 'flower', 'saturn', 'firework']).name('模型').onChange(generateShape);
            gui.addColor(state, 'color').name('颜色').onChange(v => {
                baseColor.set(v);
                generateShape(state.shape);
            });
            gui.add(state, 'particleSize', 0.1, 2.0).name('粒子大小').onChange(v => material.size = v);
        }

        // --- 5. 动画 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const pos = geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const ix = i * 3, iy = i * 3 + 1, iz = i * 3 + 2;
                
                // 目标位置 * 缩放比例
                const tx = targetPositions[ix] * state.handScale;
                const ty = targetPositions[iy] * state.handScale;
                const tz = targetPositions[iz] * state.handScale;

                pos[ix] += (tx - pos[ix]) * 0.08;
                pos[iy] += (ty - pos[iy]) * 0.08;
                pos[iz] += (tz - pos[iz]) * 0.08;
            }
            geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 启动
        initThree();
        initGUI();
        initMediaPipe(); // 异步启动 AI，不阻塞 3D 渲染
        animate();

    </script>
</body>
</html>
