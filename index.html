<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 手势交互粒子系统</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        /* 摄像头预览窗口 (为了不干扰视觉，放左下角且半透明) */
        #video-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
            transform: scaleX(-1); /* 镜像翻转 */
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* 全屏按钮 */
        #fs-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            z-index: 10;
        }
        #fs-btn:hover { background: rgba(255, 255, 255, 0.3); }
        
        /* 加载提示 */
        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="loader">正在启动摄像头和AI模型...</div>
    <div id="video-container"><video id="input-video"></video></div>
    <button id="fs-btn">⛶ 全屏模式</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/hands": "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js",
                "@mediapipe/camera_utils": "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js",
                "@mediapipe/drawing_utils": "https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';
        import { Hands, HAND_CONNECTIONS } from 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/+esm';
        import { Camera } from 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/+esm';

        // --- 全局配置 ---
        const CONFIG = {
            particleCount: 15000,
            particleSize: 0.15,
            color: '#00ffff',
            shape: 'Sphere', // Sphere, Cube, Torus
            interactionRadius: 4.0, // 手势影响范围
            interactionStrength: 0.5, // 斥力强度
            returnSpeed: 0.05, // 粒子归位速度
            showVideo: true // 是否显示摄像头
        };

        let scene, camera, renderer, particles, geometry, material;
        let originalPositions, currentPositions; // 存储目标位置和当前位置
        let handPosition = new THREE.Vector3(999, 999, 999); // 初始手势位置在屏幕外
        let isHandDetected = false;

        // --- 1. Three.js 场景初始化 ---
        function initScene() {
            scene = new THREE.Scene();
            // 添加一点雾效增加深度感
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // 简单的轨道控制器
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            // 响应窗口大小变化
            window.addEventListener('resize', onWindowResize);
        }

        // --- 2. 粒子系统核心逻辑 ---
        function createParticles() {
            if (particles) scene.remove(particles);

            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(CONFIG.particleCount * 3);
            
            // 这里的 originalPositions 存储形状的目标坐标
            originalPositions = new Float32Array(CONFIG.particleCount * 3);
            // currentPositions 是实际渲染坐标
            currentPositions = new Float32Array(CONFIG.particleCount * 3);

            // 生成初始形状 (默认为球体)
            generateShape('Sphere');

            // 初始化当前位置为随机分布（这就有一个聚拢的动画效果）
            for (let i = 0; i < CONFIG.particleCount * 3; i++) {
                currentPositions[i] = (Math.random() - 0.5) * 30; 
                positions[i] = currentPositions[i];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            material = new THREE.PointsMaterial({
                color: CONFIG.color,
                size: CONFIG.particleSize,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.8,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        // 形状生成器
        function generateShape(type) {
            const tempGeo = new THREE.BufferGeometry();
            let points = [];

            // 利用 Three.js 的几何体获取顶点，然后随机采样
            if (type === 'Sphere') {
                const sphere = new THREE.SphereGeometry(4, 64, 64);
                points = meshToPoints(sphere);
            } else if (type === 'Cube') {
                const box = new THREE.BoxGeometry(6, 6, 6, 10, 10, 10);
                points = meshToPoints(box);
            } else if (type === 'Torus') {
                const torus = new THREE.TorusGeometry(3.5, 1.5, 30, 100);
                points = meshToPoints(torus);
            }

            // 将生成的点填充到 originalPositions
            for (let i = 0; i < CONFIG.particleCount; i++) {
                // 如果生成的点不够，就循环使用
                const srcIndex = i % points.length;
                originalPositions[i * 3] = points[srcIndex].x;
                originalPositions[i * 3 + 1] = points[srcIndex].y;
                originalPositions[i * 3 + 2] = points[srcIndex].z;
            }
        }

        // 辅助函数：从Mesh几何体提取顶点
        function meshToPoints(geo) {
            const posAttribute = geo.attributes.position;
            const points = [];
            for (let i = 0; i < posAttribute.count; i++) {
                points.push(new THREE.Vector3().fromBufferAttribute(posAttribute, i));
            }
            return points;
        }

        // --- 3. 动画与物理交互循环 ---
        // 添加帧率控制
        let lastTime = 0;
        const fps = 60;
        const frameDuration = 1000 / fps;
        
        function animate(currentTime) {
            requestAnimationFrame(animate);
            
            // 控制帧率
            if (currentTime - lastTime < frameDuration) {
                return;
            }
            lastTime = currentTime;

            const positions = geometry.attributes.position.array;

            for (let i = 0; i < CONFIG.particleCount; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                // 目标位置
                const tx = originalPositions[ix];
                const ty = originalPositions[iy];
                const tz = originalPositions[iz];

                // 当前位置
                let cx = positions[ix];
                let cy = positions[iy];
                let cz = positions[iz];

                // --- 物理计算 ---
                
                // 1. 归位力 (让粒子总是想回到组成形状的位置)
                let vx = (tx - cx) * CONFIG.returnSpeed;
                let vy = (ty - cy) * CONFIG.returnSpeed;
                let vz = (tz - cz) * CONFIG.returnSpeed;

                // 2. 手势斥力 (如果检测到手)
                if (isHandDetected) {
                    const dx = cx - handPosition.x;
                    const dy = cy - handPosition.y;
                    const dz = cz - handPosition.z;
                    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

                    if (dist < CONFIG.interactionRadius) {
                        const force = (CONFIG.interactionRadius - dist) / CONFIG.interactionRadius;
                        const strength = force * CONFIG.interactionStrength; // 力量系数
                        
                        vx += (dx / dist) * strength * 2.0;
                        vy += (dy / dist) * strength * 2.0;
                        vz += (dz / dist) * strength * 2.0;
                    }
                }

                // 应用速度
                positions[ix] += vx;
                positions[iy] += vy;
                positions[iz] += vz;
            }

            geometry.attributes.position.needsUpdate = true;
            
            // 缓慢旋转整个粒子群
            particles.rotation.y += 0.002;

            renderer.render(scene, camera);
        }

        // --- 4. UI 面板 ---
        function initGUI() {
            const gui = new GUI({ title: '控制面板' });
            
            // 添加显示/隐藏摄像头选项
            gui.add(CONFIG, 'showVideo', true).name('显示摄像头').onChange(val => {
                document.getElementById('video-container').style.display = val ? 'block' : 'none';
            });
            
            gui.addColor(CONFIG, 'color').name('粒子颜色').onChange(c => {
                material.color.set(c);
            });

            gui.add(CONFIG, 'shape', ['Sphere', 'Cube', 'Torus']).name('模型形状').onChange(val => {
                generateShape(val);
            });

            const folderPhysics = gui.addFolder('交互参数');
            folderPhysics.add(CONFIG, 'particleSize', 0.01, 0.5).name('粒子大小').onChange(s => material.size = s);
            folderPhysics.add(CONFIG, 'interactionRadius', 1, 10).name('手势影响范围');
            folderPhysics.add(CONFIG, 'interactionStrength', 0.1, 2.0).name('斥力强度');
            folderPhysics.add(CONFIG, 'returnSpeed', 0.01, 0.2).name('恢复速度');
        }

        // --- 5. MediaPipe 手势追踪 ---
        async function initHandTracking() {
            const videoElement = document.getElementById('input-video');
            const loader = document.getElementById('loader');

            try {
                // 初始化Hands模型
                const hands = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`;
                    }
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults(onResults);

                // 初始化摄像头
                const cameraUtils = new Camera(videoElement, {
                    onFrame: async () => {
                        try {
                            await hands.send({image: videoElement});
                        } catch (error) {
                            console.error('发送视频帧失败:', error);
                        }
                    },
                    width: 320,
                    height: 240
                });

                // 使用Promise.race设置摄像头启动超时
                const cameraStartPromise = cameraUtils.start();
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('摄像头启动超时')), 3000);
                });

                // 尝试启动摄像头，最多等待3秒
                await Promise.race([cameraStartPromise, timeoutPromise]);
                
                console.log('摄像头已成功启动');
                
            } catch (err) {
                console.error('摄像头或AI模型初始化问题:', err);
                // 不要在这里修改加载提示，让全局超时机制来处理
            }
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                const landmarks = results.multiHandLandmarks[0];
                
                // 获取食指指尖 (索引 8) 和 手掌中心 (近似为索引 9)
                // MediaPipe 坐标是归一化的 [0, 1]，我们需要映射到 Three.js 的世界坐标
                // 假设摄像头的视野范围映射到 3D 空间的 x: -10~10, y: 8~-8
                
                // 注意：MediaPipe x 是从左到右，但我们在 CSS 镜像了视频，所以逻辑需要对应
                // 这里我们做一个简单的线性映射
                
                const x = (0.5 - landmarks[9].x) * 20; // 映射 x
                const y = (0.5 - landmarks[9].y) * 16; // 映射 y (反转Y轴)
                // z 轴可以通过手的大小估算，这里简化固定 z=4 (靠近镜头)
                const z = 4;

                // 平滑插值更新手的位置，避免抖动
                handPosition.lerp(new THREE.Vector3(x, y, z), 0.3);
                
            } else {
                isHandDetected = false;
                // 手消失时，把交互点移走
                handPosition.set(999, 999, 999);
            }
        }

        // --- 工具与事件 ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        document.getElementById('fs-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // --- 浏览器支持检查 ---
        function checkBrowserSupport() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('您的浏览器不支持摄像头访问，请使用Chrome或Firefox浏览器');
                return false;
            }
            
            if (!('WebGL2RenderingContext' in window)) {
                alert('您的浏览器不支持WebGL2，可能无法流畅运行');
            }
            
            return true;
        }

        // --- 启动 ---
        if (checkBrowserSupport()) {
            initScene();
            createParticles();
            initGUI();
            animate();
            
            // 启动摄像头
            initHandTracking();
            
            // 添加全局超时机制，确保无论如何加载提示都会被隐藏
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if (loader.style.opacity !== '0') {
                    loader.style.opacity = '0';
                    console.log('加载超时，已自动隐藏加载提示');
                }
            }, 5000); // 5秒后强制隐藏
        }

    </script>
</body>
</html>
