<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大型烟花表演</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>
    <div class="controls">
        <button id="startBtn">开始表演</button>
        <button id="stopBtn">停止表演</button>
        <button id="resetBtn">重置</button>
        <input type="range" id="fireworkCount" min="1" max="10" value="3" step="1">
        <label for="fireworkCount">烟花数量: 3</label>
    </div>
    <script src="script.js"></script>
</body>
</html>
