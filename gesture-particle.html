<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势识别 - 日期粒子与爱心效果</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', sans-serif;
        }
        
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* 摄像头预览窗口 */
        #video-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
            transform: scaleX(-1); /* 镜像翻转 */
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* 加载提示 */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            pointer-events: none;
            z-index: 20;
        }
        
        /* 控制提示 */
        #control-tip {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="loader">正在启动摄像头和AI模型...</div>
    
    <!-- 粒子画布 -->
    <canvas id="particle-canvas"></canvas>
    
    <!-- 摄像头预览 -->
    <div id="video-container">
        <video id="input-video"></video>
    </div>
    
    <!-- 控制提示 -->
    <div id="control-tip">
        <strong>控制说明：</strong><br>
        • 初始显示当前日期的粒子效果<br>
        • 比心手势可切换到爱心粒子效果
    </div>
    
    <!-- 引入 MediaPipe Hands 库 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
    
    <script>
        // 全局变量
        let canvas, ctx;
        let particles = [];
        let isHeartMode = false;
        let hands = null;
        let videoElement = null;
        
        // 状态切换防抖机制
        let heartModeTimeout = null;
        const DEBOUNCE_DELAY = 500; // 防抖延迟500毫秒
        
        // 粒子配置
        const PARTICLE_CONFIG = {
            date: {
                count: 2000,
                size: 2,
                color: '#00ff00'
            },
            heart: {
                count: 3000,
                size: 3,
                color: '#ff0080'
            }
        };
        
        // 初始化画布
        function initCanvas() {
            canvas = document.getElementById('particle-canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }
        
        // 调整画布大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        // 生成当前日期字符串（取消秒表显示）
        function getCurrentDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            // 取消秒表显示，只显示到分钟
            return `${year}年${month}月${day}日  ${hours}:${minutes}`;
        }
        
        // 创建日期粒子
        function createDateParticles() {
            console.log('开始创建日期粒子...');
            particles = [];
            const dateStr = getCurrentDateString();
            const fontSize = 80;
            const fontFamily = 'Arial';
            
            console.log('当前日期字符串:', dateStr);
            
            // 测量文本尺寸
            ctx.font = `${fontSize}px ${fontFamily}`;
            const textWidth = ctx.measureText(dateStr).width;
            const x = (canvas.width - textWidth) / 2;
            const y = canvas.height / 2;
            
            console.log('文本尺寸:', { width: textWidth, x: x, y: y });
            
            // 绘制文本到临时画布
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = textWidth;
            tempCanvas.height = fontSize * 1.5;
            
            // 清除画布
            tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
            
            // 绘制文本
            tempCtx.fillStyle = 'white';
            tempCtx.font = `${fontSize}px ${fontFamily}`;
            tempCtx.textAlign = 'left';
            tempCtx.textBaseline = 'top';
            tempCtx.fillText(dateStr, 0, 0);
            
            // 调试：显示临时画布内容
            console.log('临时画布尺寸:', { width: tempCanvas.width, height: tempCanvas.height });
            
            // 获取文本像素数据
            const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imageData.data;
            
            // 从文本像素创建粒子
            let textParticles = 0;
            let totalPixels = 0;
            let whitePixels = 0;
            
            for (let i = 0; i < data.length; i += 4) {
                totalPixels++;
                const alpha = data[i + 3];
                if (alpha > 128) {
                    whitePixels++;
                    const pixelX = (i / 4) % tempCanvas.width;
                    const pixelY = Math.floor((i / 4) / tempCanvas.width);
                    
                    // 提高从文本创建粒子的概率，确保足够的粒子被生成
                    if (Math.random() < 0.3) { // 从10%提高到30%，生成更多粒子
                        particles.push({
                            x: x + pixelX + (Math.random() - 0.5) * 10,
                            y: y + pixelY - fontSize * 0.3 + (Math.random() - 0.5) * 10,
                            vx: (Math.random() - 0.5) * 0.3,
                            vy: (Math.random() - 0.5) * 0.3,
                            size: PARTICLE_CONFIG.date.size * 1.5, // 增大粒子尺寸，便于观察
                            color: '#ff0000', // 使用红色，更醒目
                            life: 1,
                            maxLife: 1
                        });
                        textParticles++;
                    }
                }
            }
            
            console.log('文本像素统计:', { totalPixels: totalPixels, whitePixels: whitePixels });
            console.log('从文本创建的粒子数:', textParticles);
            
            // 如果从文本生成的粒子太少，直接在文本位置创建粒子
            if (textParticles < 100) {
                console.log('从文本生成的粒子太少，直接在文本位置创建粒子...');
                for (let i = 0; i < 500; i++) {
                    const randomX = Math.random() * textWidth;
                    const randomY = Math.random() * fontSize;
                    particles.push({
                        x: x + randomX,
                        y: y + randomY - fontSize * 0.3,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3,
                        size: PARTICLE_CONFIG.date.size * 2, // 进一步增大粒子尺寸
                        color: '#00ff00', // 使用绿色，更醒目
                        life: 1,
                        maxLife: 1
                    });
                }
            }
            
            // 补充一些随机粒子，确保粒子总数足够
            const targetCount = PARTICLE_CONFIG.date.count;
            const remainingParticles = targetCount - particles.length;
            let randomParticles = 0;
            
            if (remainingParticles > 0) {
                console.log('需要补充粒子:', remainingParticles);
                for (let i = 0; i < remainingParticles; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        size: PARTICLE_CONFIG.date.size,
                        color: PARTICLE_CONFIG.date.color,
                        life: Math.random(),
                        maxLife: 1
                    });
                    randomParticles++;
                }
            }
            
            console.log('补充的随机粒子数:', randomParticles);
            console.log('总粒子数:', particles.length);
            
            // 直接在主画布上绘制日期文本作为备选方案，确保至少能看到日期
            ctx.save();
            ctx.font = `${fontSize}px ${fontFamily}`;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(dateStr, canvas.width / 2, canvas.height / 2);
            ctx.restore();
        }
        
        // 创建爱心粒子
        function createHeartParticles() {
            console.log('开始创建爱心粒子...');
            particles = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const heartSize = 150;
            
            console.log('爱心中心位置:', { x: centerX, y: centerY });
            
            // 爱心曲线参数方程：
            // x = 16 * sin³(t)
            // y = 13 * cos(t) - 5 * cos(2t) - 2 * cos(3t) - cos(4t)
            for (let i = 0; i < PARTICLE_CONFIG.heart.count; i++) {
                const t = Math.random() * Math.PI * 2;
                const size = Math.random() * 0.5 + 0.5;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                
                particles.push({
                    x: centerX + x * heartSize * size,
                    y: centerY + y * heartSize * size,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    size: PARTICLE_CONFIG.heart.size,
                    color: PARTICLE_CONFIG.heart.color,
                    life: 1,
                    maxLife: 1
                });
            }
            
            console.log('爱心粒子总数:', particles.length);
        }
        
        // 更新粒子
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                
                // 更新位置
                p.x += p.vx;
                p.y += p.vy;
                
                // 添加一些随机扰动
                p.vx += (Math.random() - 0.5) * 0.05;
                p.vy += (Math.random() - 0.5) * 0.05;
                
                // 边界处理
                if (p.x < 0 || p.x > canvas.width) p.vx *= -0.5;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -0.5;
                
                // 限制速度
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (speed > 2) {
                    p.vx *= 0.95;
                    p.vy *= 0.95;
                }
                
                // 极慢的生命值消耗，让粒子几乎不会消失
                p.life -= 0.00005; // 进一步延长粒子寿命，减少闪烁
                if (p.life <= 0) {
                    // 替换即将消失的粒子，而不是直接删除
                    particles[i] = createNewParticle(p.x, p.y);
                }
            }
            
            // 只在粒子数量明显不足时才补充，避免频繁添加
            const targetCount = isHeartMode ? PARTICLE_CONFIG.heart.count : PARTICLE_CONFIG.date.count;
            if (particles.length < targetCount * 0.9) {
                const neededParticles = Math.floor((targetCount - particles.length) * 0.1); // 每次补充10%的不足量
                for (let i = 0; i < neededParticles; i++) {
                    particles.push(createNewParticle());
                }
            }
        }
        
        // 创建新粒子（根据当前模式）
        function createNewParticle(x = null, y = null) {
            if (isHeartMode) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const heartSize = 150;
                const t = Math.random() * Math.PI * 2;
                const size = Math.random() * 0.5 + 0.5;
                
                let particleX, particleY;
                if (x !== null && y !== null) {
                    // 替换模式：使用原有位置
                    particleX = x;
                    particleY = y;
                } else {
                    // 新创建：使用爱心曲线位置
                    const dx = 16 * Math.pow(Math.sin(t), 3);
                    const dy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                    particleX = centerX + dx * heartSize * size;
                    particleY = centerY + dy * heartSize * size;
                }
                
                return {
                    x: particleX,
                    y: particleY,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    size: PARTICLE_CONFIG.heart.size,
                    color: PARTICLE_CONFIG.heart.color,
                    life: 1,
                    maxLife: 1
                };
            } else {
                const dateStr = getCurrentDateString();
                const fontSize = 80;
                const fontFamily = 'Arial';
                
                ctx.font = `${fontSize}px ${fontFamily}`;
                const textWidth = ctx.measureText(dateStr).width;
                const centerX = (canvas.width - textWidth) / 2;
                const centerY = canvas.height / 2;
                
                let particleX, particleY;
                if (x !== null && y !== null) {
                    // 替换模式：使用原有位置
                    particleX = x;
                    particleY = y;
                } else {
                    // 新创建：使用文本区域内的随机位置
                    particleX = centerX + Math.random() * textWidth;
                    particleY = centerY - fontSize * 0.5 + Math.random() * fontSize * 1.5;
                }
                
                return {
                    x: particleX,
                    y: particleY,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: PARTICLE_CONFIG.date.size * 1.5,
                    color: '#ff0000',
                    life: 1,
                    maxLife: 1
                };
            }
        }
        
        // 绘制粒子
        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            
            ctx.globalAlpha = 1;
            
            // 非爱心模式下，直接在主画布上绘制日期文本作为背景，确保时间一直显示
            if (!isHeartMode) {
                const dateStr = getCurrentDateString();
                const fontSize = 80;
                const fontFamily = 'Arial';
                ctx.save();
                ctx.font = `${fontSize}px ${fontFamily}`;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(dateStr, canvas.width / 2, canvas.height / 2);
                ctx.restore();
            }
        }
        
        // 动画循环
        function animate() {
            updateParticles();
            drawParticles();
            requestAnimationFrame(animate);
        }
        
        // 检测比心手势（优化版，增加稳定性）
        function isMakingHeart(landmarks) {
            if (!landmarks || landmarks.length < 21) return false;
            
            // 获取关键点
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];
            
            // 计算拇指和食指指尖的距离
            const thumbIndexDistance = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) + 
                Math.pow(thumbTip.y - indexTip.y, 2)
            );
            
            // 计算拇指和中指指尖的距离（辅助判断）
            const thumbMiddleDistance = Math.sqrt(
                Math.pow(thumbTip.x - middleTip.x, 2) + 
                Math.pow(thumbTip.y - middleTip.y, 2)
            );
            
            // 检查手势稳定性：
            // 1. 拇指和食指距离较近（形成爱心的顶部）
            // 2. 拇指和中指距离较远（确保是比心而不是其他手势）
            // 3. 食指指尖高于中指指尖（确保手势方向正确）
            const isThumbIndexClose = thumbIndexDistance < 0.15;
            const isThumbMiddleFar = thumbMiddleDistance > 0.18;
            const isIndexAboveMiddle = indexTip.y < middleTip.y;
            
            console.log('比心检测:', {
                thumbIndexDistance: thumbIndexDistance,
                thumbMiddleDistance: thumbMiddleDistance,
                isIndexAboveMiddle: isIndexAboveMiddle,
                result: isThumbIndexClose && isThumbMiddleFar && isIndexAboveMiddle
            });
            
            // 综合判断，增加稳定性
            return isThumbIndexClose && isThumbMiddleFar && isIndexAboveMiddle;
        }
        
        // 处理手势结果
        function onResults(results) {
            // 检测是否检测到比心手势
            let detectedHeart = false;
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                detectedHeart = isMakingHeart(landmarks);
            }
            
            // 清除之前的定时器
            if (heartModeTimeout) {
                clearTimeout(heartModeTimeout);
            }
            
            // 连续检测到相同手势才切换模式，增加稳定性
            // 记录最近10次检测结果，超过7次一致才切换
            if (!window.gestureHistory) {
                window.gestureHistory = [];
            }
            
            // 添加当前检测结果到历史记录
            window.gestureHistory.push(detectedHeart);
            
            // 保持历史记录长度为10
            if (window.gestureHistory.length > 10) {
                window.gestureHistory.shift();
            }
            
            // 统计历史记录中相同结果的数量
            const trueCount = window.gestureHistory.filter(h => h).length;
            const falseCount = window.gestureHistory.filter(h => !h).length;
            const isConsistent = Math.max(trueCount, falseCount) > 7;
            const finalResult = trueCount > falseCount;
            
            console.log('手势历史统计:', {
                trueCount: trueCount,
                falseCount: falseCount,
                isConsistent: isConsistent,
                finalResult: finalResult
            });
            
            // 使用防抖机制 + 一致性检测，避免频繁切换模式导致闪烁
            heartModeTimeout = setTimeout(() => {
                // 只有当检测结果稳定时才切换模式
                if (isConsistent) {
                    // 切换粒子效果
                    if (finalResult) {
                        // 切换到爱心模式
                        if (!isHeartMode) {
                            isHeartMode = true;
                            // 平滑过渡：逐渐替换粒子，而不是一次性全部替换
                            transitionToHeartParticles();
                            console.log('切换到爱心模式');
                        }
                    } else {
                        // 切换到日期模式
                        if (isHeartMode) {
                            isHeartMode = false;
                            // 平滑过渡：逐渐替换粒子，而不是一次性全部替换
                            transitionToDateParticles();
                            console.log('切换到日期模式');
                        }
                    }
                }
            }, DEBOUNCE_DELAY);
        }
        
        // 平滑过渡到爱心粒子
        function transitionToHeartParticles() {
            // 逐帧替换粒子，而不是一次性全部替换
            let transitionIndex = 0;
            const transitionSpeed = 100; // 每次替换的粒子数量
            
            const transitionInterval = setInterval(() => {
                // 替换一部分粒子
                for (let i = 0; i < transitionSpeed && transitionIndex < particles.length; i++) {
                    particles[transitionIndex] = createNewParticle();
                    transitionIndex++;
                }
                
                // 检查是否完成过渡
                if (transitionIndex >= particles.length) {
                    clearInterval(transitionInterval);
                }
            }, 50); // 每50毫秒替换一次
        }
        
        // 平滑过渡到日期粒子
        function transitionToDateParticles() {
            // 逐帧替换粒子，而不是一次性全部替换
            let transitionIndex = 0;
            const transitionSpeed = 100; // 每次替换的粒子数量
            
            const transitionInterval = setInterval(() => {
                // 替换一部分粒子
                for (let i = 0; i < transitionSpeed && transitionIndex < particles.length; i++) {
                    particles[transitionIndex] = createNewParticle();
                    transitionIndex++;
                }
                
                // 检查是否完成过渡
                if (transitionIndex >= particles.length) {
                    clearInterval(transitionInterval);
                }
            }, 50); // 每50毫秒替换一次
        }
        
        // 初始化MediaPipe Hands
        async function initHands() {
            console.log('开始初始化MediaPipe Hands...');
            
            // 确保Hands构造函数可用
            if (typeof Hands === 'undefined') {
                console.error('Hands构造函数未找到，请检查MediaPipe Hands库是否正确加载');
                return;
            }
            
            hands = new Hands({
                locateFile: (file) => {
                    console.log('加载MediaPipe文件:', file);
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`;
                }
            });
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.3, // 降低置信度阈值，提高检测灵敏度
                minTrackingConfidence: 0.3  // 降低置信度阈值，提高追踪灵敏度
            });
            
            hands.onResults(onResults);
            console.log('MediaPipe Hands初始化成功');
        }
        
        // 初始化摄像头
        async function initCamera() {
            videoElement = document.getElementById('input-video');
            
            try {
                console.log('开始获取摄像头权限...');
                
                // 获取摄像头权限
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: 320,
                        height: 240
                    }
                });
                
                console.log('获取摄像头权限成功');
                
                // 设置视频流
                videoElement.srcObject = stream;
                
                // 等待视频流加载
                await new Promise(resolve => {
                    videoElement.onloadedmetadata = resolve;
                });
                
                console.log('视频流加载成功');
                
                // 播放视频
                await videoElement.play();
                console.log('视频播放成功');
                
                // 确保Hands模型已初始化
                if (!hands) {
                    console.error('Hands模型未初始化，无法处理视频帧');
                    return false;
                }
                
                // 处理视频帧
                const processFrame = async () => {
                    if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                        try {
                            await hands.send({image: videoElement});
                        } catch (error) {
                            console.error('发送视频帧失败:', error);
                        }
                    }
                    requestAnimationFrame(processFrame);
                };
                
                // 启动视频帧处理
                processFrame();
                console.log('视频帧处理启动成功');
                
                return true;
            } catch (error) {
                console.error('摄像头初始化失败:', error);
                alert('无法访问摄像头，请检查权限设置');
                return false;
            }
        }
        
        // 初始化
        async function init() {
            const loader = document.getElementById('loader');
            
            try {
                console.log('开始初始化...');
                
                // 初始化画布
                initCanvas();
                
                // 保存初始日期字符串
                lastDateStr = getCurrentDateString();
                
                // 初始化日期粒子
                createDateParticles();
                
                // 启动动画
                animate();
                
                // 初始化MediaPipe Hands
                await initHands();
                
                // 初始化摄像头
                const cameraSuccess = await initCamera();
                
                if (cameraSuccess) {
                    loader.textContent = '初始化成功！';
                    setTimeout(() => {
                        loader.style.display = 'none';
                    }, 1000);
                }
                
            } catch (error) {
                console.error('初始化失败:', error);
                loader.textContent = '初始化失败，请检查控制台';
                loader.style.color = 'red';
            }
        }
        
        // 每分钟更新一次日期（因为只显示到分钟）
        let lastDateStr = '';
        setInterval(() => {
            if (!isHeartMode) {
                const currentDateStr = getCurrentDateString();
                // 只有当日期字符串变化时才更新粒子
                if (currentDateStr !== lastDateStr) {
                    lastDateStr = currentDateStr;
                    createDateParticles();
                    console.log('日期更新:', currentDateStr);
                }
            }
        }, 60000); // 60秒更新一次
        
        // 启动应用
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
